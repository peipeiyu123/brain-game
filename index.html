<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class = "app">

        <div class="screen login">
            <!-- 1. 遊戲首頁：預設只顯示名稱與這兩個大按鈕 -->
            <div class="main-menu-container">
                <h1 id="projectName">高齡者大腦體操</h1>
                <button id="tabLogin" class="btn">登入帳號</button>
                <button id="tabRegister" class="btn">註冊帳號</button> 
            </div>

            <!-- 2. 登入表單畫面：點擊登入後，大按鈕消失，這裡獨立在中央漂亮顯示 -->
            <form id="loginForm" class="auth-form hidden">
                <h2 class="loginTitle">會員登入</h2>
                <div class="loginInputs">
                    <input type="text" id="loginAccount" placeholder="請輸入帳號" required>
                    <input type="password" id="loginPassword" placeholder="請輸入密碼" required>
                </div>
                <button type="button" id="btnSubmitLogin" class="btn">確認登入</button>
                <button type="button" class="btn btn-back" onclick="backToMainMenu()">返回主選單</button>
            </form>

            <!-- 3. 註冊表單畫面：點擊註冊後顯示 -->
            <form id="registerForm" class="auth-form hidden">
                <h2 class="loginTitle">建立新帳號</h2>
                <div class="loginInputs">
                    <input type="text" id="regAccount" placeholder="請設定帳號" required>
                    <input type="password" id="regPassword" placeholder="請設定密碼" required>
                </div>
                <hr>
                <div class="form-container">
                    <h2>填寫問卷調查</h2>
                    <iframe
                        id="google-form-iframe"
                        src="" 
                        width="100%" 
                        height="450" 
                        frameborder="0" 
                        marginheight="0" 
                        marginwidth="0">
                        載入中…
                    </iframe>
                </div>
                <button type="button" id="btnSubmitRegister" class="btn">註冊完成</button>
                <button type="button" class="btn btn-back" onclick="backToMainMenu()">返回主選單</button>
            </form>
        </div>
    
        <div class = "screen control hidden">
            <button class="btn" id = "btnSemantic">找出不合群</button>
            <button class="btn" id = "btnMemory">數字點點名</button>
            <button class="btn" id = "btnVisualSearch">抓出冒牌貨</button>
            <button class="btn" id = "btnSpatial">圖形轉轉樂</button>
            <button class="btn" id = "btnSwitching">加減方向王</button>
        </div>

        <div class = "screen instructions hidden">

            <div id = "gameTitle" class="hidden"></div>

            <div id = "instructionText" class="hidden"></div>

            <div class="buttonType hidden">
                <button class="btn" id = "picture">圖片題</button>
                <button class="btn" id = "character">文字題</button>
            </div>
        
            <div class="buttonGroup hidden">
                <button class="btn" id = "practiceButton">試玩</button>
                <button class="btn" id = "startButton">開始遊戲</button>
            </div>
        </div>

        <div class="screen gameArea hidden">
            <div id = "progress"></div>
            <div class="buttons"></div>
            <div id="overlayContainer"></div>
            <div id="result"></div>
        </div>
    
        <div class="screen result hidden">
            <div id="playerScore"></div>

            <button id="continueButton">繼續遊玩</button>
            <button id="endButton">結束遊玩</button>

            <canvas id="radarChart"></canvas>
        </div>

        <div class=" screen memoryArea hidden">

            <div id="memoryDisplay"></div>
            <div id="memoryInstruction"></div>

            <div id="memoryInput"></div>

            <div class="keypad">
                <button>1</button><button>2</button><button>3</button>
                <button>4</button><button>5</button><button>6</button>
                <button>7</button><button>8</button><button>9</button>
                <button>⌫</button><button>0</button><button>✔</button>
            </div>

            <div id="memoryResult"></div>
        </div>
        
        <div class="screen visualArea hidden">
            <div id="visualProgress"></div>
            <div id="visualButtons" class="buttons"></div>
            <div id="visualOverlayContainer"></div>
        </div>

    </div>
    
    <script src="script.js"></script>
</body>
</html>
